[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lrckit"
dynamic = ["version"]
description = "Interactive CLI to search, romanize and embed synchronized lyrics into audio files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mutagen>=1.45",
    "requests>=2.28",
    "pyreadline3>=3.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
romanization = [
    "pykakasi>=2.2",
    "pypinyin>=0.49",
    "korean-romanizer>=0.25",
    "anyascii>=0.3",
]
providers = ["syncedlyrics>=0.7"]
all = [
    "pykakasi>=2.2",
    "pypinyin>=0.49",
    "korean-romanizer>=0.25",
    "anyascii>=0.3",
    "syncedlyrics>=0.7",
]
dev = ["pytest>=7", "pyflakes>=3"]

[project.scripts]
lrckit = "lrckit.cli:main"

[tool.setuptools]
packages = ["lrckit"]

[tool.setuptools.dynamic]
# Single source of truth; read statically, the package is not imported.
version = { attr = "lrckit.config.__version__" }
